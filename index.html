<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131e">
  <meta name="description" content="海绵宝宝同人动作肉鸽。穿过比奇堡的夜色，打过二十波水母与机器人。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="比奇堡大乱斗">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="manifest" href="./app.webmanifest">
  <link rel="stylesheet" href="./style.css?v=7">
  <title>海绵宝宝：比奇堡大乱斗</title>
</head>
<body>
  <div id="lobby">
    <header class="topbar">
      <div class="top-inner">
        <a class="brand" href="./" aria-label="比奇堡大乱斗首页">
          <span class="brand-icon">✿</span><span>比奇堡大乱斗<small>BIKINI BOTTOM SURVIVORS</small></span>
        </a>
        <div class="top-actions">
          <button class="icon-button" data-audio="music" aria-label="背景音乐" title="背景音乐">♫</button>
          <button class="icon-button" data-audio="sfx" aria-label="攻击音效" title="攻击音效">◖))</button>
          <button class="install-button" data-open="install"><span>↥</span> <span>手机游玩</span></button>
        </div>
      </div>
    </header>
    <main class="shell">
      <section class="hero" aria-labelledby="title">
        <canvas id="splash" aria-hidden="true"></canvas>
        <div class="hero-copy">
          <div class="kicker"><span></span> 海绵宝宝同人动作肉鸽</div>
          <h1 id="title"><span>比奇堡</span><br>大乱斗<span class="bang">!</span></h1>
          <p>每波坚守 60 秒。拾取补给点，<br>在下一波来临前组装四武器阵容。</p>
          <button class="dark-button" data-open="guide"><span>▤</span> 玩法图鉴</button>
        </div>
      </section>
      <div class="section-heading">
        <h2>出战准备</h2>
        <span id="record">最高纪录 0 / 20 波</span>
      </div>
      <div class="loadout">
        <section class="panel" aria-labelledby="character-title">
          <h3 id="character-title"><span class="section-icon">✿</span> 选择角色</h3>
          <div class="character-row" id="characters"></div>
          <div class="character-info" id="character-info"></div>
        </section>
        <section class="panel" aria-labelledby="map-title">
          <h3 id="map-title"><span class="section-icon aqua">⌖</span> 战场与难度</h3>
          <div class="map-row" id="maps"></div>
          <div class="difficulty-row" id="difficulties" aria-label="难度"></div>
        </section>
      </div>
      <div class="launch">
        <div class="launch-info"><span class="launch-icon">✦</span><div><strong id="selection"></strong><small id="selection-detail"></small></div></div>
        <div class="launch-actions">
          <button class="dark-button" id="new-run" hidden>新开一局</button>
          <button class="primary start" id="start">开始战斗</button>
        </div>
      </div>
      <footer>海绵宝宝同人游戏 <span>·</span> 本机保存通关和解锁进度</footer>
    </main>
  </div>
  <main id="battle" hidden aria-label="战斗" tabindex="-1">
    <canvas id="field" aria-label="比奇堡战场"></canvas>
    <div class="hud">
      <div class="hud-top">
        <div class="hud-vitals">
          <canvas id="portrait" width="48" height="48" aria-hidden="true"></canvas>
          <div>
            <strong id="player-name"></strong>
            <div class="meter health" role="meter" aria-label="生命" aria-valuemin="0"><i id="health-fill"></i><b id="health-text"></b></div>
            <div class="meter experience" role="meter" aria-label="经验" aria-valuemin="0"><i id="xp-fill"></i><b id="xp-text"></b></div>
          </div>
        </div>
        <div class="hud-wave">
          <strong id="wave">第 1 / 20 波</strong>
          <span id="wave-time" role="timer" aria-label="波次剩余时间">1:00</span>
          <div class="time-bar" aria-hidden="true"><i id="time-fill"></i></div>
          <small id="wave-detail"></small>
          <div id="wave-track" aria-hidden="true"></div>
        </div>
        <div class="hud-actions">
          <button class="icon-button" data-audio="music" aria-label="背景音乐" title="背景音乐">♫</button>
          <button class="icon-button" data-audio="sfx" aria-label="攻击音效" title="攻击音效">◖))</button>
          <button class="icon-button" id="pause" aria-label="暂停" title="暂停">Ⅱ</button>
        </div>
      </div>
      <span class="gift-counter"><span aria-hidden="true">◆</span> 补给点 <b id="point-count">0</b></span>
      <div id="boss-meter" hidden>
        <strong id="boss-name"></strong>
        <div class="meter" role="meter" aria-label="首领生命" aria-valuemin="0"><i id="boss-fill"></i></div>
        <small id="boss-move" hidden></small>
      </div>
    </div>
    <div class="wave-banner" id="wave-banner" aria-hidden="true"></div>
    <div class="controls">
      <div id="joystick" role="group" aria-label="移动摇杆"><span id="stick" aria-hidden="true"></span></div>
      <span class="desktop-hint">WASD / 方向键移动 · 自动攻击</span>
      <div class="skills">
        <button type="button" id="skill" class="skill" aria-keyshortcuts="Space"><span class="skill-symbol" aria-hidden="true">◉</span><strong>泡泡旋刃</strong><small></small></button>
        <button type="button" id="ultimate" class="skill ultimate" aria-keyshortcuts="Q"><span class="skill-symbol" aria-hidden="true">✷</span><strong>水母风暴</strong><small></small></button>
      </div>
    </div>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" hidden></div>
  <script src="./data.js?v=7" defer></script>
  <script src="./catalog.js?v=7" defer></script>
  <script src="./art.js?v=7" defer></script>
  <script src="./audio.js?v=7" defer></script>
  <script src="./prep.js?v=7" defer></script>
  <script src="./game.js?v=7" defer></script>
</body>
</html>
